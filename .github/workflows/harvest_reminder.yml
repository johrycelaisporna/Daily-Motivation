name: Harvest Reminder Bot

on:
  schedule:
    # 3pm Sydney time = 05:00 UTC
    - cron: "0 5 10 * *"
    - cron: "0 5 25 * *"
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run Harvest Reminder Bot
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python harvest_reminder_bot.py
