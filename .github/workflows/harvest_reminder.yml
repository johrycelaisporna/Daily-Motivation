name: Harvest Reminder Bot

on:
  schedule:
    - cron: "0 5 10 * *"
    - cron: "0 5 25 * *"
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Harvest Reminder Bot
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: python harvest_reminder_bot.py
